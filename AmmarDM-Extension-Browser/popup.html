<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 250px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 14px;
      margin: 0;
      background: #FAFAFA;
      color: #333;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }
    .logo {
      font-size: 24px;
      margin-left: 8px;
    }
    .title {
      font-size: 13px;
      font-weight: bold;
      color: #1565C0;
    }
    .status-box {
      background: #E8F5E9;
      border: 1px solid #C8E6C9;
      border-radius: 4px;
      padding: 8px;
      font-size: 11px;
      color: #2E7D32;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
    }
    .footer {
      font-size: 10px;
      color: #777;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon32.png" width="28" height="28" style="margin-left: 8px;" />
    <div>
      <div class="title">Ammar DM Integration</div>
      <div style="font-size: 10px; color: #666;">إضافة المتصفح الذكية</div>
    </div>
  </div>
  <div class="status-box">
    <span>🟢</span>
    <span style="margin-right: 6px;">جاهز لاقتناص الروابط والفيديوهات</span>
  </div>
  <div class="footer">
    المطور: عمار الصميدعي
  </div>
</body>
</html>
